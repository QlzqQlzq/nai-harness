# nai harness 配置；example.invalid 是占位地址，不能实际调用。
# 注释用#开头；true=开启，false=关闭；修改后重载插件。
# 完整字段参考：高级服务参数仅在第一个出图服务展开一次；其他服务可按需采用相同字段。
# 不是额外加载的配置文件；将所需字段写入实际config.toml的对应服务或key。

[plugin] # 基础与指令
# 总开关，配置服务后开启
enabled = false
# 配置版本
config_version = "0.1.0"
# 主命令与别名，不含斜杠；改后重载
command_names = ["nai"]
# 负面词指令与别名；改后重载
uc_names = ["uc"]
# 指令前缀
prefix = "/"
# 单次输入字符上限
max_input_chars = 12000
# 测试开关：false=正常出图；true=仅返回最终请求参数，不调用出图接口，但解析/搜索仍可能调用外部服务
dry_run = false

[modules] # 模块开关
# NAI出图
draw = true
# 用户负面词管理
uc = true
# 反推模块
reverse = true
# 引用重画
redraw = true
# 画风管理
styles = true
# 麦麦自然对话画图工具；修改后重载
natural_tool = false

[permissions] # 权限
# 全局管理QQ
# 示例：admin_qq = ["123456789"]
admin_qq = []
# 群号到管理QQ列表；仅管理对应群的模型/NSFW，不是普通绘图白名单；群号和QQ均加引号
# 示例：group_managers = { "123456789" = ["111111111", "222222222"] }
# 示例：左边是群号，右边是该群管理QQ；其他群可继续加条目。
group_managers = {}
# 开放群聊使用
group_enabled = true
# 开放私聊使用
private_enabled = true
# 私聊可管理自己的模型/NSFW，不可管理全局
private_manage = true
# 私聊允许功能；可选值："draw", "uc", "reverse", "redraw", "styles", "model", "nsfw", "status"
private_features = ["draw", "uc", "reverse", "redraw", "styles", "model", "nsfw", "status"]
# 禁止用户QQ
blocked_users = []
# 使用白名单；空表示不限制
allowed_users = []
# 禁止群号
blocked_groups = []
# 允许群号；空表示不限制
allowed_groups = []
# 各群初始设置；可覆盖enabled/features/model/nsfw；不是管理员名单；已保存的模型/NSFW优先
# 示例：groups = { "123456789" = { enabled = true, model = "nai-diffusion-5-full", nsfw = false, features = ["draw", "uc", "reverse", "redraw", "styles", "model", "nsfw", "status"] } }
groups = {}

[generation] # 生成参数
# 默认出图模型
model = "nai-diffusion-5-full"
# 允许选择的模型
allowed_models = ["nai-diffusion-5-full", "nai-diffusion-4-5-full"]
# 默认宽x高
size = "832x1216"
# 步数
steps = 23
# 引导强度
scale = 5
# CFG rescale
cfg = 0
# 采样器
sampler = "k_euler_ancestral"
# 噪声调度
noise_schedule = "karras"
# 原插件SMEA/DYN模式
other = 0
# 默认负面词
negative = "lowres, worst quality, bad quality"
# 最大总像素
max_pixels = 2097152
# 角色块数量上限
max_roles = 6
# 允许用户在指令中覆盖的参数；可填size/seed/steps/scale/cfg/sampler/noise_schedule/other；例如 /nai 1girl --steps=28 --size=832x1216
overrides = ["size", "seed", "steps", "scale"]
# 显式配置失败降模型关系；空为关闭
# 示例：fallback_models = { "nai-diffusion-5-full" = "nai-diffusion-4-5-full" }
# 示例：上例允许NAI5失败后降到4.5；须匹配fallback_errors，两个模型都须在allowed_models中。
fallback_models = {}
# 降模型触发类别：quota/auth/rate_limit/timeout/server/invalid_response/bad_request/unconfigured/budget；还需fallback_models映射；总预算耗尽后不会额外请求
fallback_errors = ["quota"]

[drawing] # 绘图接口总设置：这里管理真正生成图片的URL和密钥，不是写提示词的模型
# never=不跨链；sfw_to_nsfw=SFW失败可用NSFW池；nsfw_to_sfw=反向；both=双向；模式跟随会话设置；可选值："never", "sfw_to_nsfw", "nsfw_to_sfw", "both"
cross_fallback = "never"

[drawing.sfw] # 普通模式使用的接口列表：会话NSFW关闭时选这一组URL和key
# 不同URL间选服务：ordered=按列表顺序；round_robin=每次请求轮换起点；可选值："ordered", "round_robin"
strategy = "ordered"
# 允许调用标记为付费的服务
allow_paid = false
# 整个池调用的最大外部尝试数
max_attempts = 6
# 整个池调用总时限秒
total_timeout = 120

[[drawing.sfw.endpoints]] # 服务列表；每个[[...endpoints]]新增一个服务，不是重复定义；name在池内唯一
# 同一池内唯一服务名
name = "sfw-native-primary"
# 启用服务
enabled = true
# 完整端点URL，不自动追加路径；例如 /v1/chat/completions 或 /ai/generate-image
url = "https://example.invalid/sfw-native-primary"
# 协议：出图用native/openai_image；解析用openai_chat；反推用openai_chat/json_tagger；搜索用deepseek_search/tavily/searxng；抓取用json_fetch；可选值："native", "openai_image", "openai_chat", "deepseek_search", "tavily", "searxng", "json_tagger", "json_fetch"
kind = "native"
# 解析/反推模型名称
model = ""
# 出图支持的模型；空表示不限制
models = []
# 出图模型别名映射；上游名称与内部名称相同时保持空表，不是备用模型
# 示例：model_map = { "nai-diffusion-5-full" = "nai5" }
# 示例：nai5仅演示别名写法，必须替换为上游实际支持的名称。
model_map = {}
# 同一URL内选key：ordered=按列表顺序；round_robin=每次请求轮换起点；可选值："ordered", "round_robin"
key_strategy = "ordered"
# 单次读取超时秒
timeout_seconds = 60
# 是否属于付费备用路由；受池内 allow_paid 控制
paid = false
# 允许无认证调用；仍需一项具名 key 配置
anonymous = false
# 自定义请求头，不写入日志
# 示例：headers = { "User-Agent" = "nai-harness", "X-Custom-Header" = "value" }
# 示例：没有上游特殊要求就保持空表；Bearer认证由keys自动生成，不必填Authorization。
headers = {}
# 此服务代理；空则用 network.proxy
proxy = ""
# 仅OpenAI出图：native=透传角色块(上游须支持)；fold=折入主词(丢失独立位置/负面块)；reject=拒绝多人角色块；可选值："native", "fold", "reject"
role_mode = "fold"
# 额外请求参数，不能覆盖身份、提示词和图片字段
# 示例：extra_body = { quality = "standard" }
# 示例：仅填写上游协议支持的额外参数；此处不验证上游是否支持quality。
extra_body = {}

[[drawing.sfw.endpoints.keys]] # 不限数量的 key 列表
# 日志使用的 key 名称；同服务内唯一
name = "primary"
# 人工备注，不影响请求
note = ""
# 启用此 key
enabled = true
# 密钥；不附加配置后缀
secret = ""
# 可选环境变量名；直接填写secret时留空；非空时只读此环境变量，缺失也不会回退到secret
env = "NAI_SFW_PRIMARY"
# 覆盖重试次数；null继承，0禁止重试
# retries = 0  # 去掉行首#可启用；省略的子字段继承服务默认值
# 覆盖重试间隔
# retry_interval = 1  # 去掉行首#可启用；省略的子字段继承服务默认值
# 覆盖单次超时
# timeout_seconds = 60  # 去掉行首#可启用；省略的子字段继承服务默认值
# 覆盖额度耗尽策略
# quota = {action = "cooldown", cooldown_seconds = 300, retry = false}  # 去掉行首#可启用；省略的子字段继承服务默认值
# 覆盖认证策略
# auth = {action = "disable"}  # 去掉行首#可启用；省略的子字段继承服务默认值
# 覆盖限流策略
# rate_limit = {cooldown_seconds = 30}  # 去掉行首#可启用；省略的子字段继承服务默认值
# 覆盖超时策略
# timeout = {retry = false}  # 去掉行首#可启用；省略的子字段继承服务默认值
# 覆盖服务器错误策略
# server = {retry = true}  # 去掉行首#可启用；省略的子字段继承服务默认值
# 覆盖响应格式错误策略
# invalid_response = {action = "skip"}  # 去掉行首#可启用；省略的子字段继承服务默认值
# 覆盖其他请求错误策略
# bad_request = {action = "stop"}  # 去掉行首#可启用；省略的子字段继承服务默认值
# 已知的每日额度恢复UTC小时；空则使用冷却策略
# quota_reset_hour_utc = 0  # 去掉行首#可启用；省略的子字段继承服务默认值

[[drawing.sfw.endpoints.keys]] # 不限数量的 key 列表
# 日志使用的 key 名称；同服务内唯一
name = "backup"
# 人工备注，不影响请求
note = ""
# 启用此 key
enabled = true
# 密钥；不附加配置后缀
secret = ""
# 可选环境变量名；直接填写secret时留空；非空时只读此环境变量，缺失也不会回退到secret
env = "NAI_SFW_PRIMARY_BACKUP"
# 覆盖重试次数；null继承，0禁止重试
# retries = 0  # 去掉行首#可启用；省略的子字段继承服务默认值
# 覆盖重试间隔
# retry_interval = 1  # 去掉行首#可启用；省略的子字段继承服务默认值
# 覆盖单次超时
# timeout_seconds = 60  # 去掉行首#可启用；省略的子字段继承服务默认值
# 覆盖额度耗尽策略
# quota = {action = "cooldown", cooldown_seconds = 300, retry = false}  # 去掉行首#可启用；省略的子字段继承服务默认值
# 覆盖认证策略
# auth = {action = "disable"}  # 去掉行首#可启用；省略的子字段继承服务默认值
# 覆盖限流策略
# rate_limit = {cooldown_seconds = 30}  # 去掉行首#可启用；省略的子字段继承服务默认值
# 覆盖超时策略
# timeout = {retry = false}  # 去掉行首#可启用；省略的子字段继承服务默认值
# 覆盖服务器错误策略
# server = {retry = true}  # 去掉行首#可启用；省略的子字段继承服务默认值
# 覆盖响应格式错误策略
# invalid_response = {action = "skip"}  # 去掉行首#可启用；省略的子字段继承服务默认值
# 覆盖其他请求错误策略
# bad_request = {action = "stop"}  # 去掉行首#可启用；省略的子字段继承服务默认值
# 已知的每日额度恢复UTC小时；空则使用冷却策略
# quota_reset_hour_utc = 0  # 去掉行首#可启用；省略的子字段继承服务默认值

[drawing.sfw.endpoints.defaults] # 本服务所有key的默认失败策略；省略使用内置默认值，每把key可单独覆盖
# 除首次之外的尝试次数
retries = 0
# 重试间隔秒
retry_interval = 1

[drawing.sfw.endpoints.defaults.quota] # 额度不足处理
# skip=本次跳过此key；cooldown=暂时冷却；disable=停用至管理员恢复；stop=停止本次请求的路由尝试；可选值："skip", "cooldown", "disable", "stop"
action = "cooldown"
# 冷却秒数；仅 cooldown 有效
cooldown_seconds = 300.0
# 当前 key 是否重试；仍受总预算限制
retry = false

[drawing.sfw.endpoints.defaults.auth] # 401/认证失败处理
# skip=本次跳过此key；cooldown=暂时冷却；disable=停用至管理员恢复；stop=停止本次请求的路由尝试；可选值："skip", "cooldown", "disable", "stop"
action = "disable"
# 冷却秒数；仅 cooldown 有效
cooldown_seconds = 60
# 当前 key 是否重试；仍受总预算限制
retry = false

[drawing.sfw.endpoints.defaults.rate_limit] # 429 限流处理
# skip=本次跳过此key；cooldown=暂时冷却；disable=停用至管理员恢复；stop=停止本次请求的路由尝试；可选值："skip", "cooldown", "disable", "stop"
action = "cooldown"
# 冷却秒数；仅 cooldown 有效
cooldown_seconds = 30.0
# 当前 key 是否重试；仍受总预算限制
retry = false

[drawing.sfw.endpoints.defaults.timeout] # 网络超时处理
# skip=本次跳过此key；cooldown=暂时冷却；disable=停用至管理员恢复；stop=停止本次请求的路由尝试；可选值："skip", "cooldown", "disable", "stop"
action = "cooldown"
# 冷却秒数；仅 cooldown 有效
cooldown_seconds = 10.0
# 当前 key 是否重试；仍受总预算限制
retry = false

[drawing.sfw.endpoints.defaults.server] # 5xx 处理
# skip=本次跳过此key；cooldown=暂时冷却；disable=停用至管理员恢复；stop=停止本次请求的路由尝试；可选值："skip", "cooldown", "disable", "stop"
action = "cooldown"
# 冷却秒数；仅 cooldown 有效
cooldown_seconds = 10.0
# 当前 key 是否重试；仍受总预算限制
retry = true

[drawing.sfw.endpoints.defaults.invalid_response] # 成功状态但响应内容无效
# skip=本次跳过此key；cooldown=暂时冷却；disable=停用至管理员恢复；stop=停止本次请求的路由尝试；可选值："skip", "cooldown", "disable", "stop"
action = "skip"
# 冷却秒数；仅 cooldown 有效
cooldown_seconds = 60
# 当前 key 是否重试；仍受总预算限制
retry = false

[drawing.sfw.endpoints.defaults.bad_request] # 其他4xx错误
# skip=本次跳过此key；cooldown=暂时冷却；disable=停用至管理员恢复；stop=停止本次请求的路由尝试；可选值："skip", "cooldown", "disable", "stop"
action = "stop"
# 冷却秒数；仅 cooldown 有效
cooldown_seconds = 60
# 当前 key 是否重试；仍受总预算限制
retry = false

[drawing.sfw.endpoints.auto_buy] # 此出图服务的可选自动补购，仅支持rinko账户协议
# 仅出图端点额度不足时补购；默认关闭
enabled = false
# rinko兼容登录完整URL
login_url = ""
# 图包/余额查询完整URL
status_url = ""
# 图包购买完整URL；不自动重试购买请求
purchase_url = ""
# 补购账号；相同登录URL与账号共享每日限制
username = ""
# 补购密码
password = ""
# 密码环境变量；填写后优先
password_env = ""
# 余额低于此值时允许购买
min_credits = 5
# 每次购买包数
packs_per_buy = 1
# UTC每日最多包数；0禁止购买
max_packs_per_day = 20
# 单次最高Gems花费，0禁止购买
max_gems_per_buy = 100
# 购买尝试之间最短间隔，持久化
cooldown_seconds = 120
# 单次账户接口超时；受绘图总预算限制
timeout_seconds = 15
# fallback=补购失败后继续备用出图路由；stop=终止；可选值："fallback", "stop"
failure = "fallback"

[[drawing.sfw.endpoints]] # 服务列表；每个[[...endpoints]]新增一个服务，不是重复定义；name在池内唯一
# 同一池内唯一服务名
name = "sfw-native-backup"
# 启用服务
enabled = true
# 完整端点URL，不自动追加路径；例如 /v1/chat/completions 或 /ai/generate-image
url = "https://example.invalid/sfw-native-backup"
# 协议：出图用native/openai_image；解析用openai_chat；反推用openai_chat/json_tagger；搜索用deepseek_search/tavily/searxng；抓取用json_fetch；可选值："native", "openai_image", "openai_chat", "deepseek_search", "tavily", "searxng", "json_tagger", "json_fetch"
kind = "native"
# 出图支持的模型；空表示不限制
models = []
# 出图模型别名映射；上游名称与内部名称相同时保持空表，不是备用模型
# 示例：model_map = { "nai-diffusion-5-full" = "nai5" }
# 示例：nai5仅演示别名写法，必须替换为上游实际支持的名称。
model_map = {}
# 不限数量的 key 列表
# 示例：每个 { ... } 是一把key；直接填secret时把env改成空串，使用环境变量时填env。
# 示例：停用某把key可在该项加 enabled = false；重试/冷却等覆盖写法见config.reference.toml。
keys = [
    {name = "primary", secret = "", env = "NAI_SFW_SECONDARY"},
    {name = "backup", secret = "", env = "NAI_SFW_SECONDARY_BACKUP"},
]
# 同一URL内选key：ordered=按列表顺序；round_robin=每次请求轮换起点；可选值："ordered", "round_robin"
key_strategy = "ordered"
# 单次读取超时秒
