# 完整端点URL，不自动追加路径；例如 /v1/chat/completions 或 /ai/generate-image
url = "https://example.invalid/reverse-nsfw"
# 协议：出图用native/openai_image；解析用openai_chat；反推用openai_chat/json_tagger；搜索用deepseek_search/tavily/searxng；抓取用json_fetch；可选值："native", "openai_image", "openai_chat", "deepseek_search", "tavily", "searxng", "json_tagger", "json_fetch"
kind = "openai_chat"
# 解析/反推模型名称
model = "replace-with-provider-model"
# 不限数量的 key 列表
# 示例：每个 { ... } 是一把key；直接填secret时把env改成空串，使用环境变量时填env。
# 示例：停用某把key可在该项加 enabled = false；重试/冷却等覆盖写法见config.reference.toml。
keys = [
    {name = "primary", secret = "", env = "REVERSE_NSFW_KEY"},
    {name = "backup", secret = "", env = "REVERSE_NSFW_KEY_BACKUP"},
]
# 同一URL内选key：ordered=按列表顺序；round_robin=每次请求轮换起点；可选值："ordered", "round_robin"
key_strategy = "ordered"
# 单次读取超时秒
timeout_seconds = 60

[redraw] # 引用重画规则
# 允许引用本群其他用户的生成记录重画；默认仅自己
allow_other_users = false
# 无引用时重画本人本会话最近记录
allow_last_without_quote = true
# 继承原图尺寸、步数、采样器等；显式参数优先
inherit_parameters = true
# 保留原图种子；关闭时生成新种子
inherit_seed = false
# 继承原图模型；仍须在当前允许列表中
inherit_model = false

[natural] # 自然对话入口
# 提供给麦麦的工具说明
description = "用户明确请求绘图时创建绘图确认指令。保留用户原始角色、tag和风格要求。"
# 自然对话确认指令有效期；身份不使用模型参数
confirmation_seconds = 300

[queue] # 并发与队列
# 全局活动任务上限
global_limit = 4
# 所有群任务上限
group_limit = 3
# 所有私聊任务上限
private_limit = 2
# 每会话并发
per_session = 1
# 每用户跨会话并发
per_user = 1
# 等待任务上限；0不排队
waiting_limit = 10
# 排队最长等待秒；0立即拒绝
wait_seconds = 30
# 同用户两次提交间隔
cooldown_seconds = 1
# 含排队解析出图的任务总超时
task_timeout = 240
# 群号到该群并发上限；不覆盖全局上限
# 示例：group_overrides = { "123456789" = 2 }
group_overrides = {}

[quota] # 本地额度
# 群友使用限额：false=不限制本地次数；true=按用户/群配额限制；不会查询或修改上游key余额
enabled = false
# 每用户每周期额度
user_limit = 100
# 每群每周期额度
group_limit = 1000
# 本地计数单价，不是真实费用；值为1表示每张扣1点，用户额度100即最多100张；未列出模型按1点
model_costs = {nai-diffusion-5-full = 1, nai-diffusion-4-5-full = 1}
# 额度周期小时，从UTC纪元整段计算
reset_hours = 24
# 图已生成但发送失败时是否退本地额度
refund_delivery_failure = false
# 重启后处理未完成记录：retain=保留已预占的本地点数；refund=退还本地点数；不影响上游余额，上游是否出图可能未知；可选值："retain", "refund"
crash_recovery = "retain"
# 按 platform:用户ID 覆盖额度，例如 qq:12345
# 示例：user_limits = { "qq:123456789" = 200 }
# 示例：冒号属于键名，必须带引号；上例是该用户每周期200点，不是QQ号200。
user_limits = {}
# 按 platform:g:群ID 覆盖额度，例如 qq:g:12345
# 示例：group_limits = { "qq:g:123456789" = 2000 }
group_limits = {}

[output] # 消息输出
# 成功回复：image=仅图片；brief=图片加简报；detailed=图片加详细回执；可选值："image", "brief", "detailed"
mode = "image"
# 回复原消息
quote_reply = true
# 开始处理时发送提示
progress = false
# 进度提示文字
progress_text = "正在处理绘图请求。"
# 成功回执显示最终tag
show_tags = false
# 成功回执显示服务与key名称
show_route = false
# 仅发送失败重试；不会重新生成图片
send_retries = 0
# 发送重试间隔
send_interval = 1

[storage] # 持久化与日志
# 保存生成图片，用于引用重画/发送重试
save_images = true
# 图片保留天数；0不自动清理
image_days = 7
# 重画/引用记录有效秒数；0不保留
history_seconds = 86400
# 历史最多条数
history_limit = 200
# 图片水印文字，空关闭
watermark = ""
# 保存最终生成参数到PNG元数据，可能含用户提示词
metadata = false
# 记录不含密钥的请求结果
logs_enabled = true
# 日志包含输入提示词；开启涉及隐私
log_prompts = false
# 日志保留天数；0不自动清理
log_days = 7
# 历史、图片与日志清理间隔
cleanup_seconds = 3600
# 最多保存图片数；0不限制
max_image_files = 500
# 保存图片总容量；0不限制
max_image_disk_bytes = 1073741824
# 持久化key冷却/停用状态，重启后仍生效
persist_key_health = true

[network] # 网络
# 默认代理URL；空为直连
proxy = ""
# 连接超时秒
connect_timeout = 10
# HTTP连接上限
max_connections = 20
# 下载/解码单张图片上限
max_image_bytes = 20971520
# 允许下载图片的域名；空表示允许公网域名
image_download_hosts = []
# 单次上游HTTP响应解压后大小上限
max_response_bytes = 33554432
# 远程图片下载总超时秒
download_timeout = 20
